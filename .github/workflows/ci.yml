name: Enterprise quality gates

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff==0.12.10
      - run: >-
          python -m ruff check app/config.py app/config/logging_config.py
          app/main.py app/services app/routers/auth.py app/routers/caisse.py
          app/routers/charges.py app/routers/financials.py app/routers/paiements.py
          app/routers/alerts.py app/routers/jobs.py app/routers/product_boms.py
          app/routers/stock.py app/routers/search.py app/routers/reports.py
          app/routers/transformations.py app/routers/batiments.py
          app/models/financial_correction.py
          app/models/inventory.py app/models/nomenclature.py app/schemas/batiment.py
          app/schemas/compte_bancaire.py app/schemas/cycle_production.py
          app/schemas/production.py app/utils/security.py tests/test_config.py
          tests/test_enterprise_remediation.py
          scripts/check_database_security.py
          scripts/backfill_inventory.py
      - run: >-
          python -m pytest --override-ini addopts='' --strict-markers
          --tb=short --disable-warnings --cov=app.services
          --cov-report=term-missing --cov-fail-under=70 -q
      - run: python -m alembic heads
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: comptabilite_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comptabilite_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: development
          SECRET_KEY: ci-only-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Vercel environment preflight contract
        working-directory: .
        env:
          VERCEL_ENV: preview
          DATABASE_URL: postgresql://app_runtime:ci-only@db.example.com:5432/app?sslmode=require
          MIGRATION_DATABASE_URL: postgresql://app_migrator:ci-only@db.example.com:5432/app?sslmode=require
          SECRET_KEY: ci-preview-secret-value-for-tests-only-0123456789
          CRON_SECRET: ci-preview-cron-value-for-tests-only-0123456789
          CORS_ORIGINS: https://preview.example.com
          DEBUG: "false"
          ENABLE_AUTH: "true"
          ENABLE_RATE_LIMITING: "true"
        run: node scripts/check_vercel_environment.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit:coverage
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    # Secrets are intentionally not referenced from a job-level `if`: GitHub
    # does not make the secrets context reliably available there. Enable this
    # release gate with the repository variable RUN_E2E=true instead.
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify authenticated E2E configuration
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_EMAIL"
          test -n "$E2E_PASSWORD"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --project=mobile
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_MUTATION_TESTS: ${{ secrets.E2E_MUTATION_TESTS }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-security:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.RUN_DATABASE_SECURITY == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_database_security.py
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          ENVIRONMENT: preview
          SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          ENABLE_AUTH: "true"
          ENABLE_RATE_LIMITING: "true"
