name: Enterprise quality gates

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff==0.12.10
      - run: python -m ruff check app/services app/routers/financials.py app/routers/alerts.py app/routers/jobs.py app/routers/product_boms.py app/routers/stock.py app/routers/search.py app/routers/reports.py app/routers/transformations.py app/models/financial_correction.py app/models/inventory.py app/models/nomenclature.py tests/test_enterprise_remediation.py scripts/check_database_security.py scripts/backfill_inventory.py
      - run: >-
          python -m pytest --override-ini addopts='' --strict-markers
          --tb=short --disable-warnings --cov=app.services
          --cov-report=term-missing --cov-fail-under=70 -q
      - run: python -m alembic heads
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit:coverage
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    if: ${{ secrets.E2E_BASE_URL != '' && secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --project=mobile
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-security:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.RUN_DATABASE_SECURITY == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_database_security.py
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          ENVIRONMENT: preview
          SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          ENABLE_AUTH: "true"
          ENABLE_RATE_LIMITING: "true"
