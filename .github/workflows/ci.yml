name: Enterprise quality gates

on:
  push:
    branches: [main, staging, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Verify bulk contact balances and existing contact APIs
        run: python -m pytest --override-ini addopts='' tests/test_contact_balances.py tests/test_clients.py tests/test_fournisseurs.py -q
      - run: python -m pip install ruff==0.12.10
      - run: >-
          python -m ruff check app/config.py app/config/logging_config.py
          app/main.py app/services app/routers/auth.py app/routers/caisse.py
          app/routers/charges.py app/routers/financials.py app/routers/paiements.py
          app/routers/alerts.py app/routers/jobs.py app/routers/product_boms.py
          app/routers/stock.py app/routers/search.py app/routers/reports.py
          app/routers/transformations.py app/routers/productions.py
          app/routers/batiments.py app/routers/cycles_production.py app/routers/lots_production.py
          app/models/financial_correction.py
          app/models/inventory.py app/models/job_execution.py
          app/models/nomenclature.py app/models/production.py app/models/lot_production.py
          scripts/check_database_schema.py scripts/validate_independent_lot_database.py tests/test_database_schema.py
          tests/test_lc_schema_migration.py tests/test_shared_lot_migration.py
          app/schemas/batiment.py
          app/schemas/compte_bancaire.py app/schemas/cycle_production.py app/schemas/lot_production.py
          app/schemas/production.py app/utils/egg_product_sync.py
          app/utils/production_cycles.py app/utils/cycle_insights.py app/utils/security.py
          tests/test_independent_lots.py tests/test_config.py
          tests/test_production_stock.py tests/test_enterprise_remediation.py
          scripts/check_database_security.py alembic/versions/job_execution_audit.py
          alembic/versions/independent_lots_per_building.py scripts/backfill_inventory.py
      - run: >-
          python -m pytest --override-ini addopts='' --strict-markers
          --tb=short --disable-warnings --cov=app.services
          --cov-report=term-missing --cov-fail-under=70 -q
      - run: python -m alembic heads
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: comptabilite_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comptabilite_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Create runtime role required by database migrations
        run: psql postgresql://postgres:postgres@localhost:5432/comptabilite_db -v ON_ERROR_STOP=1 -c "CREATE ROLE app_runtime NOLOGIN"
      - run: python -m alembic upgrade heads
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: development
          SECRET_KEY: ci-only-secret
      - name: Verify production correction foundation on isolated PostgreSQL
        run: python -m pytest --override-ini addopts='' tests/test_production_correction_foundation_pg.py -q
        env:
          POSTGRES_MIGRATION_TEST_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
      - name: Apply existing correction foundation to disposable PostgreSQL only
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_correction_history_foundation.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
      - name: Prove an interrupted migration rolls back completely
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
        run: |
          # Intentional SQL error appended in the same transaction; no changes may survive.
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 \
            -f migrations/production_integrated_corrections_atomic.sql \
            -c 'SELECT 1 / 0' >/dev/null 2>&1; then
            echo "Rollback probe unexpectedly succeeded"
            exit 1
          fi
          remaining="$(psql "$DATABASE_URL" -At -c "
            SELECT count(*) FROM information_schema.columns
            WHERE table_schema='public' AND (
              (table_name='transactions' AND column_name IN ('stock_revision','quantite_annulee'))
              OR (table_name='paiements' AND column_name='nature')
              OR (table_name='egg_sale_allocations' AND column_name='quantite_livree')
            )")"
          test "$remaining" = 0
      - name: Rehearse integrated correction schema and payment/stock guards
        run: |
          # One PostgreSQL transaction; failure rolls back all schema and guard changes.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_integrated_corrections_atomic.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
      - name: Verify atomic credits/refunds rollback on disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
        run: |
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 \
            -f migrations/production_party_credits_refunds_atomic.sql \
            -c 'SELECT 1 / 0' > /dev/null 2>&1; then
            echo "Unexpected successful rollback probe"; exit 1
          fi
          count="$(psql "$DATABASE_URL" -At -c "SELECT count(*) FROM pg_class WHERE relnamespace='public'::regnamespace AND relname IN ('avances','affectations_credit')")"
          test "$count" = 0
      - name: Apply atomic credits/refunds schema to disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_party_credits_refunds_atomic.sql
      - name: Prove Release 3 migration rollback and retry on isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
        run: |
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 \
            -f migrations/production_cheque_lc_lifecycle_atomic.sql \
            -c 'SELECT 1 / 0' > /dev/null 2>&1; then
            echo "Release 3 rollback probe unexpectedly succeeded"; exit 1
          fi
          test "$(psql "$DATABASE_URL" -At -c "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='paiements' AND column_name='role_lc'")" = 0
          test "$(psql "$DATABASE_URL" -At -c "SELECT to_regclass('public.utilisations_lettre_credit') IS NULL")" = t
      - name: Apply atomic cheque and LC lifecycle migration to disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_cheque_lc_lifecycle_atomic.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
      - name: Check model compatibility after migrations
        run: python scripts/check_database_schema.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: development
          SECRET_KEY: ci-only-secret
      - name: Verify LC maintenance migration and replay
        run: python -m pytest --override-ini addopts='' tests/test_lc_schema_migration.py tests/test_shared_lot_migration.py -q
        env:
          POSTGRES_MIGRATION_TEST_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db

      - name: Verify independent-lot constraints and snapshot triggers on PostgreSQL
        run: python scripts/validate_independent_lot_database.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: development
          SECRET_KEY: ci-only-secret
      - name: Verify per-building lot behavior and monthly ledger cutoffs
        run: >-
          python -m pytest --override-ini addopts='' tests/test_independent_lots.py
          tests/test_enterprise_remediation.py::test_monthly_report_distinguishes_ledger_cutoffs_and_cheque_settlement -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: testing
          SECRET_KEY: ci-only-secret


  release1-integrated-native:
    # The normal backend suite runs SQLite fixtures. This isolated job keeps
    # real PostgreSQL revision triggers installed for the entire writer test.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: comptabilite_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comptabilite_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Migrate disposable PostgreSQL only
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: development
          SECRET_KEY: ci-only-secret
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE app_runtime NOLOGIN"
          python -m alembic upgrade heads
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_correction_history_foundation.sql
          # One PostgreSQL transaction; failure rolls back all schema and guard changes.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_integrated_corrections_atomic.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_party_credits_refunds_atomic.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_cheque_lc_lifecycle_atomic.sql
      - name: Verify native cheque settlement, LC correction and refund guards
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/release3_native_pg_checks.sql
      - name: Verify native operation journal, ledger replacement and retries
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: testing
          SECRET_KEY: ci-only-secret
        run: >-
          python -m pytest --override-ini addopts=''
          tests/test_production_integrated_corrections_pg.py -q
      - name: Validate credits/refunds on native PostgreSQL with audit and credit triggers
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: testing
          SECRET_KEY: ci-only-secret
        run: >-
          python -m pytest --override-ini addopts=''
          tests/test_credits.py tests/test_refunds.py -q


  frontend:
    # Pin a Playwright-supported OS; ubuntu-latest is now Ubuntu 26.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Vercel environment preflight contract
        working-directory: .
        env:
          VERCEL_ENV: preview
          DATABASE_URL: postgresql://app_runtime:ci-only@db.example.com:5432/app?sslmode=require
          SECRET_KEY: ci-preview-secret-value-for-tests-only-0123456789
          CRON_SECRET: ci-preview-cron-value-for-tests-only-0123456789
          CORS_ORIGINS: https://preview.example.com
          DEBUG: "false"
          ENABLE_AUTH: "true"
          ENABLE_RATE_LIMITING: "true"
        run: node scripts/check_vercel_environment.mjs
      - name: Verify branch-specific Supabase pooler login is preview-only
        working-directory: .
        env:
          DATABASE_URL: postgresql://app_runtime.r3preview.exampleprojectref:ci-only@pooler.example.com:5432/postgres
          SECRET_KEY: ci-preview-secret-value-for-tests-only-0123456789
          CRON_SECRET: ci-preview-cron-value-for-tests-only-0123456789
          CORS_ORIGINS: https://preview.example.com
          DEBUG: "false"
          ENABLE_AUTH: "true"
          ENABLE_RATE_LIMITING: "true"
        run: |
          VERCEL_ENV=preview node scripts/check_vercel_environment.mjs
          if VERCEL_ENV=production node scripts/check_vercel_environment.mjs >/dev/null 2>&1; then
            echo "Preview-only database role must be rejected in production"
            exit 1
          fi
      - name: Reject mojibake in frontend source
        run: node ../scripts/check_frontend_encoding.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit:coverage
      - run: npm run build
      - name: Install Chromium for deterministic contact UI checks
        run: npx playwright install --with-deps chromium
      - name: Verify contacts and flock lifecycle on desktop and mobile
        run: npx playwright test --config playwright.contacts.config.ts
      - name: Save contact UI screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-card-ui
          path: frontend/test-results/
      - run: npm audit --audit-level=high

  e2e:
    # Secrets are intentionally not referenced from a job-level `if`: GitHub
    # does not make the secrets context reliably available there. Enable this
    # release gate with the repository variable RUN_E2E=true instead.
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify authenticated E2E configuration
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_EMAIL"
          test -n "$E2E_PASSWORD"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --project=mobile
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_MUTATION_TESTS: ${{ secrets.E2E_MUTATION_TESTS }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-security:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.RUN_DATABASE_SECURITY == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_database_security.py
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          ENVIRONMENT: preview
          SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          CORS_ORIGINS: ${{ secrets.STAGING_CORS_ORIGINS }}
          DEBUG: "false"
          ENABLE_AUTH: "true"
          ENABLE_RATE_LIMITING: "true"

  release3-authenticated-native:
    # Real FastAPI login and LC lifecycle against a disposable PostgreSQL 16.
    # Does not read staging/production credentials or alter external databases.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: comptabilite_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comptabilite_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Install existing financial foundations and Release 3 atomically on local PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: development
          SECRET_KEY: release3-native-test-secret-only-0000000000000000
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE app_runtime NOLOGIN"
          python -m alembic upgrade heads
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_correction_history_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_integrated_corrections_atomic.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_party_credits_refunds_atomic.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f migrations/production_cheque_lc_lifecycle_atomic.sql
      - name: Validate authenticated LC lifecycle and cheque corrections via protected API
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comptabilite_db
          ENVIRONMENT: testing
          ENABLE_AUTH: "true"
          ENABLE_RATE_LIMITING: "false"
          ENABLE_CORRECTION_WRITES: "true"
          SECRET_KEY: release3-native-test-secret-only-0000000000000000
        run: >-
          python -m pytest --override-ini addopts=''
          tests/test_release3_authenticated_pg.py --tb=short -q
